name: Déploiement de l'API

# Lancé à la main : onglet Actions → Déploiement de l'API → Run workflow. Faisable depuis un téléphone.
# Après l'envoi, sur le serveur : php bin/console cache:clear, puis doctrine:migrations:migrate (voir docs/mise-en-ligne.md).
on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Dépendances de production et envoi FTP
    runs-on: ubuntu-latest
    env:
      API_FTP_SERVER: ${{ secrets.API_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Dépendances de production
        working-directory: api
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction --no-progress
      - name: Secrets absents
        if: env.API_FTP_SERVER == ''
        run: |
          echo "Secrets API_FTP_* non configurés : rien n'est envoyé (voir docs/mise-en-ligne.md)."
          exit 1
      # FTPS avec lftp (session TLS réutilisée sur le canal de données, exigée par o2switch ; voir deploy.yml).
      # Jamais envoyés : ce qui ne sert qu'au développement. Rien n'est supprimé sur le serveur :
      # .env.local et var/ y restent intacts.
      - name: Envoi sur le serveur (FTPS)
        env:
          API_FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
          API_FTP_SERVER_DIR: ${{ secrets.API_FTP_SERVER_DIR }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp > /dev/null
          # o2switch n'envoie pas ses certificats intermédiaires : on les récupère et on vérifie la chaîne.
          bash .github/scripts/chaine-ftps.sh "$API_FTP_SERVER" /tmp/ca-ftps.pem
          lftp --env-password -u "$API_FTP_USERNAME" "ftp://$API_FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:ca-file /tmp/ca-ftps.pem
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --parallel=4 \
            --exclude '(^|/)\.git' \
            --exclude '^var/' \
            --exclude '^tests/' \
            --exclude '^compose[^/]*\.yaml$' \
            --exclude '^phpunit\.dist\.xml$' \
            --exclude '^\.env\.(local|dev)$' \
            api/ "${API_FTP_SERVER_DIR:-/}"
          bye
          EOF
