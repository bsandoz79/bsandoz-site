name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api:
    name: API – conteneur, base MySQL, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bsandoz_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp -papp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/bsandoz?serverVersion=8.0.40&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php bin/console lint:container
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console dbal:run-sql "SELECT 1"
      - run: php bin/console doctrine:schema:validate --skip-sync
      - run: php bin/phpunit

  front:
    name: Front – lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
