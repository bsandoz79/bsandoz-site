name: Publication de la bibliothèque de blocs

# Publie @bsandoz79/blocs sur GitHub Packages (privé) quand on pousse une étiquette blocs-vX.Y.Z.
on:
  push:
    tags: ['blocs-v*']

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Tests, build et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bsandoz79'
      - run: npm ci
      - name: Version du paquet identique à l'étiquette
        run: |
          VERSION="$(node -p "require('./packages/blocs/package.json').version")"
          test "blocs-v$VERSION" = "$GITHUB_REF_NAME" || { echo "Étiquette $GITHUB_REF_NAME et version $VERSION différentes"; exit 1; }
      - run: npm run lint -w packages/blocs
      - run: npm run test -w packages/blocs
      - run: npm run build -w packages/blocs
      - run: npm publish -w packages/blocs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
