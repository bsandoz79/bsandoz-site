name: Déploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un envoi n'est jamais coupé en cours de route (sinon le serveur peut garder un index.html qui pointe
# vers des fichiers pas encore envoyés : page blanche). Les déploiements suivants attendent leur tour.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build et envoi FTP
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation, tests et build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEVIS_URL: ${{ vars.VITE_DEVIS_URL }}
        run: |
          npm ci
          npm run test -w packages/blocs
          npm run test -w front
          npm run build -w front
      - name: Secrets absents
        if: env.FTP_SERVER == ''
        run: echo "Secrets FTP non configurés, déploiement ignoré (voir docs/deploiement.md)."
      # Envoi en FTPS avec lftp : contrairement à FTP-Deploy-Action, il réutilise la session TLS sur le canal de
      # données, ce qu'exige le serveur FTP d'o2switch (sinon « ECONNRESET (data socket) »).
      # Le mot de passe passe par la variable LFTP_PASSWORD (--env-password) : jamais dans la ligne de commande.
      # Pas de suppression côté serveur : seuls les fichiers du site sont envoyés ou mis à jour.
      - name: Envoi sur o2switch (FTPS)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp > /dev/null
          # o2switch n'envoie pas ses certificats intermédiaires : on les récupère et on vérifie la chaîne.
          bash .github/scripts/chaine-ftps.sh "$FTP_SERVER" /tmp/ca-ftps.pem
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:ca-file /tmp/ca-ftps.pem
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          # 1. Tout sauf index.html : les nouveaux fichiers (JS, CSS, images) arrivent d'abord.
          mirror --reverse --verbose --parallel=2 --exclude-glob index.html --exclude-glob indexnow.json front/dist/ "${FTP_SERVER_DIR:-/}"
          # 2. index.html en dernier : il ne pointe que vers des fichiers déjà présents.
          put -O "${FTP_SERVER_DIR:-/}" front/dist/index.html
          bye
          EOF
      # Annonce les pages à Bing (IndexNow) une fois en ligne : la clé /<clé>.txt doit déjà être sur le serveur.
      - name: Annonce à IndexNow (Bing)
        if: env.FTP_SERVER != ''
        run: node front/scripts/indexnow.mjs front/dist/indexnow.json
