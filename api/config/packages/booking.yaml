# Module Booking : réglages propres à CHAQUE installation (bsandoz.fr, ou l'API d'un client).
# Les valeurs viennent des variables d'environnement (.env.local sur le serveur), avec des valeurs par défaut.
parameters:
    booking.jours_travailles: [0, 1, 2, 3, 4]          # lundi = 0 … dimanche = 6 (À CONFIRMER)
    booking.creneaux: ['09:00', '10:30', '14:00', '15:30', '17:00']   # À CONFIRMER
    booking.duree_minutes: 60
    booking.delai_min_jours: 1
    booking.horizon_jours: 60
    booking.fuseau: 'Europe/Paris'
    booking.expediteur: '%env(BOOKING_EXPEDITEUR)%'
    booking.professionnel_nom: '%env(BOOKING_PROFESSIONNEL_NOM)%'
    booking.professionnel_email: '%env(BOOKING_PROFESSIONNEL_EMAIL)%'
    booking.url_publique: '%env(BOOKING_URL_PUBLIQUE)%'

# jours_travailles et creneaux sont les valeurs de départ : une fois réglés depuis le back-office, c'est la base qui compte.
# Les adaptateurs (contrôleur, mails…) sont enregistrés par config/services.yaml, chargé APRÈS ce fichier :
# ils lisent leurs réglages par l'attribut #[Autowire('%booking.…%')], sans être redéclarés ici.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Ports du domaine → adaptateurs (remplacer ici pour changer de base, d'envoi de mail…).
    App\Booking\Domain\RendezVousRepository: '@App\Booking\Infrastructure\Doctrine\DoctrineRendezVousRepository'
    App\Booking\Domain\Notifications: '@App\Booking\Infrastructure\Mail\NotificationsParMail'
    App\Booking\Domain\DisponibilitesEnregistrees: '@App\Booking\Infrastructure\Doctrine\DisponibilitesDoctrine'
    App\Booking\Domain\PreferencesRappel: '@App\Booking\Infrastructure\Systeme\RappelsPourTous'
    App\Booking\Domain\Horloge: '@App\Booking\Infrastructure\Systeme\HorlogeSysteme'
    App\Booking\Domain\Identifiants: '@App\Booking\Infrastructure\Systeme\IdentifiantsAleatoires'

    # La règle en vigueur : la base si elle a été réglée, sinon les valeurs ci-dessus.
    App\Booking\Domain\RegleDisponibilite:
        factory: ['@App\Booking\Infrastructure\Systeme\FabriqueRegle', 'creer']
