doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # Chaque module déclare ici sa correspondance en XML (Infrastructure/Doctrine),
        # pour que le domaine reste indépendant de Doctrine.
        mappings:
            Contenu:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Contenu/Infrastructure/Doctrine/mapping'
                prefix: 'App\Contenu\Domain'
                alias: Contenu
            Catalogue:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalogue/Infrastructure/Doctrine/mapping'
                prefix: 'App\Catalogue\Domain'
                alias: Catalogue
            Booking:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Booking/Infrastructure/Doctrine/mapping'
                prefix: 'App\Booking\Domain'
                alias: Booking
            Auth:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Infrastructure/Doctrine/mapping'
                prefix: 'App\Auth\Domain'
                alias: Auth
            Prospect:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Prospect/Infrastructure/Doctrine/mapping'
                prefix: 'App\Prospect\Domain'
                alias: Prospect
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
