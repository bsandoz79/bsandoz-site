<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f29" />
    <!-- Thème avant l'affichage (nuit par défaut, ou le choix gardé dans le navigateur) : pas de flash de l'autre thème. -->
    <script>
      (function () {
        var theme = 'nuit';
        try {
          if (localStorage.getItem('bsandoz.theme') === 'clair') theme = 'clair';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'clair') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f6fa');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
    />
    <meta name="description" content="Sites internet, prise de rendez-vous en ligne et applis pour artisans, commerçants et indépendants autour d'Amiens." />
    <title>Baptiste Sandoz – Création de sites web à Amiens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
