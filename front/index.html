<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- « ?v=2 » : nouvelle adresse à chaque changement de logo, sinon les navigateurs gardent l'ancienne icône. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <!-- Icône des résultats Google : carrée, multiple de 48 px. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f29" />
    <!-- Thème avant l'affichage (nuit par défaut, ou le choix gardé dans le navigateur) : pas de flash de l'autre thème. -->
    <script>
      (function () {
        var theme = 'nuit';
        try {
          if (localStorage.getItem('bsandoz.theme') === 'clair') theme = 'clair';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        // JavaScript actif : le texte écrit pour Google (data-statique) est caché en attendant l'affichage du site.
        document.documentElement.classList.add('js');
        if (theme === 'clair') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f6fa');
      })();
    </script>
    <meta name="description" content="Sites internet, prise de rendez-vous en ligne et applis pour artisans, commerçants et indépendants autour d'Amiens." />
    <title>Baptiste Sandoz – Création de sites web à Amiens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
